services:
  postgres:
    image: postgres:15-alpine
    container_name: aguafix_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-aguafix_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-aguafix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: pipiolovic/aguafix-api:latest
    container_name: aguafix_api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
