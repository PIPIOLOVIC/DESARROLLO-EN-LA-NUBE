services:
  postgres:
    image: postgres:15-alpine
    container_name: aguafix_postgres
    restart: always
    environment:
      POSTGRES_DB: aguafix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: